[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readprune"
version = "0.2.0"
description = "Reference implementation of question-conditioned readout-guided visual token selection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "scipy>=1.10,<2"]

[project.optional-dependencies]
readout = ["torch==2.1.2", "transformers==4.45.2", "safetensors>=0.4,<1", "Pillow>=10,<12"]
qwen = ["torch==2.6.0", "transformers==4.57.6", "safetensors>=0.4,<1", "Pillow>=10,<12", "torchvision==0.21.0"]

[project.urls]
Repository = "https://github.com/Milkxy/ReadPrune"

[tool.setuptools.packages.find]
include = ["readprune*"]
